[workspace]
resolver = "2"
members = [
    "benchmarks",
    "cli",
    "core",
    "gateway",
    "mcp",
    "rest",
    "demo",
    "mapreduce",
    "rpc",
]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/kevwan/rust-zero"
homepage = "https://github.com/kevwan/rust-zero"
readme = "README.md"
keywords = ["web", "grpc", "microservices", "middleware", "runtime"]
categories = ["web-programming", "network-programming", "asynchronous"]

[workspace.dependencies]
prost = "0.14"
prost-reflect = "0.16"
prost-types = "0.14"
tonic = { version = "0.14", default-features = false }
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-reflection = "0.14"
tower = "0.5"
