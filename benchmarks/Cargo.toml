[package]
name = "rust-zero-benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Versioned performance and fault workloads for rust-zero"

[dependencies]
actix-web = "4"
futures = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false }
rest = { package = "rust-zero-rest", path = "../rest", version = "0.1.0-alpha.2" }
rpc = { package = "rust-zero-rpc", path = "../rpc", version = "0.1.0-alpha.2" }
rust-zero-core = { path = "../core", version = "0.1.0-alpha.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
toml = "0.8"
tonic = { workspace = true, features = ["codegen", "transport"] }

[lints.rust]
unsafe_code = "allow"
