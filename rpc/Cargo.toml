[package]
name = "rust-zero-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Production Tonic gRPC client, server, discovery, and resilience utilities for rust-zero"
documentation = "https://docs.rs/rust-zero-rpc"

[lib]
name = "rpc"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
telemetry = ["rust-zero-core/telemetry"]

[dependencies]
bytes = "1"
futures = "0.3"
http = "1"
http-body = "1"
pin-project-lite = "0.2"
prost = "0.13"
rust-zero-core = { path = "../core", version = "0.1.0-alpha.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.12", features = ["transport", "tls"] }
tonic-health = "0.12"
tower = { version = "0.4", features = ["discover"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[dev-dependencies]
rcgen = "0.13"
