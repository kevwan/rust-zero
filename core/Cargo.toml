[package]
name = "rust-zero-core"
version = "0.1.0"
edition = "2021"
description = "Runtime primitives for rust-zero services"

[features]
default = []
etcd = ["dep:etcd-client"]
kubernetes = ["dep:futures", "dep:k8s-openapi", "dep:kube"]
stores = ["stores-mongo", "stores-redis", "stores-sql"]
stores-mongo = ["dep:mongodb"]
stores-redis = ["dep:redis"]
stores-sql = ["dep:sqlx"]
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
]

[dependencies]
etcd-client = { version = "0.19", optional = true }
futures = { version = "0.3", optional = true }
json5 = "1.3"
k8s-openapi = { version = "0.28", features = ["latest"], optional = true }
kube = { version = "4.2", features = ["runtime"], optional = true }
opentelemetry = { version = "0.32", features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "http-proto", "reqwest-blocking-client", "trace"], optional = true }
opentelemetry_sdk = { version = "0.32", features = ["trace"], optional = true }
mongodb = { version = "3.8", optional = true }
redis = { version = "0.32", features = ["cluster-async", "tokio-comp"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "mysql"], optional = true }
tokio = { version = "1", features = ["macros", "rt", "signal", "sync", "time"] }
toml = "0.8"
