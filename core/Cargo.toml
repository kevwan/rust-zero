[package]
name = "rust-zero-core"
version = "0.1.0"
edition = "2021"
description = "Runtime primitives for rust-zero services"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt", "time"] }
toml = "0.8"
