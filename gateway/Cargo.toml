[package]
name = "rust-zero-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Configuration-driven HTTP and gRPC transcoding gateway for rust-zero"
documentation = "https://docs.rs/rust-zero-gateway"

[lib]
name = "gateway"

[[bin]]
name = "gateway"
path = "src/main.rs"

[package.metadata.docs.rs]
all-features = true

[dependencies]
actix-web = "4"
bytes = "1"
futures = "0.3"
http = "1"
prost.workspace = true
prost-reflect = { workspace = true, features = ["serde"] }
prost-types.workspace = true
reqwest = { version = "0.12", features = ["stream"] }
rust-zero-core = { path = "../core", version = "0.1.0-alpha.2" }
rust-zero-rest = { path = "../rest", version = "0.1.0-alpha.2" }
rust-zero-rpc = { path = "../rpc", version = "0.1.0-alpha.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = { workspace = true, features = ["codegen", "transport"] }
tonic-prost.workspace = true
tonic-reflection.workspace = true

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build.workspace = true
